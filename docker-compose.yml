name: ${COMPOSE_PROJECT_NAME:-predictionlab}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predictionlab}
      POSTGRES_USER: ${POSTGRES_USER:-predictionlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictionlab_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - predictionlab

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - predictionlab

  migrate:
    build:
      context: ./backend
      target: runtime
    command:
      - alembic
      - -c
      - /app/alembic.ini
      - upgrade
      - head
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://predictionlab:predictionlab_local_only@postgres:5432/predictionlab}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - predictionlab

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-ai-polyphite-backend}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://predictionlab:predictionlab_local_only@postgres:5432/predictionlab}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}
      OLLAMA_BASE_URL: ${CONTAINER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2.0}
      AI_POLYPHITE_ENABLED_PROVIDERS: ${AI_POLYPHITE_ENABLED_PROVIDERS:-mock}
      AI_POLYPHITE_REPLAY_DATASET_DIRECTORY: /app/datasets/replay
      AI_POLYPHITE_ENABLE_MANUAL_PREDICTION_RUNS: ${AI_POLYPHITE_ENABLE_MANUAL_PREDICTION_RUNS:-false}
      AI_POLYPHITE_ENABLE_MANUAL_PAPER_TRADING: ${AI_POLYPHITE_ENABLE_MANUAL_PAPER_TRADING:-false}
      AI_POLYPHITE_REPLAY_PREDICTION_INTERVAL_HOURS: ${AI_POLYPHITE_REPLAY_PREDICTION_INTERVAL_HOURS:-24}
      PREDICTION_MINIMUM_CONFIDENCE: ${PREDICTION_MINIMUM_CONFIDENCE:-0.40}
      PREDICTION_MAXIMUM_DISAGREEMENT: ${PREDICTION_MAXIMUM_DISAGREEMENT:-0.30}
      PREDICTION_MAXIMUM_OBSERVATION_AGE_SECONDS: ${PREDICTION_MAXIMUM_OBSERVATION_AGE_SECONDS:-172800}
      PREDICTION_WEAK_EDGE: ${PREDICTION_WEAK_EDGE:-0.03}
      PREDICTION_MODERATE_EDGE: ${PREDICTION_MODERATE_EDGE:-0.08}
      PREDICTION_STRONG_EDGE: ${PREDICTION_STRONG_EDGE:-0.15}
      PAPER_CURRENCY_UNIT: ${PAPER_CURRENCY_UNIT:-USD_SIMULATED}
      PAPER_INITIAL_BALANCE: ${PAPER_INITIAL_BALANCE:-100.00}
      PAPER_ENTRY_MINIMUM_EDGE: ${PAPER_ENTRY_MINIMUM_EDGE:-0.03}
      PAPER_ENTRY_MINIMUM_CONFIDENCE: ${PAPER_ENTRY_MINIMUM_CONFIDENCE:-0.45}
      PAPER_MAXIMUM_DATA_AGE_SECONDS: ${PAPER_MAXIMUM_DATA_AGE_SECONDS:-172800}
      PAPER_SIZING_POLICY: ${PAPER_SIZING_POLICY:-confidence_adjusted}
      PAPER_BASE_EQUITY_FRACTION: ${PAPER_BASE_EQUITY_FRACTION:-0.01}
      PAPER_MAXIMUM_MARKET_FRACTION: ${PAPER_MAXIMUM_MARKET_FRACTION:-0.02}
      PAPER_MAXIMUM_CATEGORY_FRACTION: ${PAPER_MAXIMUM_CATEGORY_FRACTION:-0.15}
      PAPER_MAXIMUM_TOTAL_EXPOSURE_FRACTION: ${PAPER_MAXIMUM_TOTAL_EXPOSURE_FRACTION:-0.50}
      PAPER_COST_MODEL: ${PAPER_COST_MODEL:-conservative}
      PAPER_PERCENTAGE_FEE: ${PAPER_PERCENTAGE_FEE:-0.005}
      PAPER_SLIPPAGE_PROBABILITY_POINTS: ${PAPER_SLIPPAGE_PROBABILITY_POINTS:-0.005}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    networks:
      - predictionlab

  worker:
    build:
      context: ./backend
      target: runtime
    command:
      - python
      - -m
      - predictionlab.runtime.collector_cli
      - worker
    environment:
      SERVICE_NAME: ai-polyphite-collector-worker
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://predictionlab:predictionlab_local_only@postgres:5432/predictionlab}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}
      OLLAMA_BASE_URL: ${CONTAINER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_POLYPHITE_ENABLED_PROVIDERS: ${AI_POLYPHITE_ENABLED_PROVIDERS:-mock}
      AI_POLYPHITE_COLLECTOR_INTERVAL_SECONDS: ${AI_POLYPHITE_COLLECTOR_INTERVAL_SECONDS:-300}
      AI_POLYPHITE_PROVIDER_INTERVALS_SECONDS: ${AI_POLYPHITE_PROVIDER_INTERVALS_SECONDS:-}
      AI_POLYPHITE_COLLECTOR_RUN_IMMEDIATELY: ${AI_POLYPHITE_COLLECTOR_RUN_IMMEDIATELY:-true}
      AI_POLYPHITE_REPLAY_DATASET_DIRECTORY: /app/datasets/replay
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    networks:
      - predictionlab

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    networks:
      - predictionlab

volumes:
  postgres_data:
  redis_data:

networks:
  predictionlab:
    driver: bridge
