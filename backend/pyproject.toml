[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "predictionlab"
version = "0.1.0"
description = "Experimental prediction-market research laboratory."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "AI-Polyphite contributors" },
]
dependencies = [
  "alembic>=1.18.5,<1.19",
  "fastapi>=0.140.0,<0.141",
  "httpx>=0.28.1,<0.29",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "redis>=8.0.1,<9",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.51.0,<0.52",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.0,<2.4",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.0,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predictionlab = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires live infrastructure services",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
