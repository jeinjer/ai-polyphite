name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: predictionlab
          POSTGRES_USER: predictionlab
          POSTGRES_PASSWORD: predictionlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predictionlab -d predictionlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+psycopg://predictionlab:predictionlab@localhost:5432/predictionlab
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install "./backend[dev]"
      - name: Lint
        run: python -m ruff check backend
      - name: Type check
        run: python -m mypy --config-file backend/pyproject.toml backend/src
      - name: Test
        run: python -m pytest backend/tests
      - name: Check migration drift
        run: python -m alembic -c backend/alembic.ini check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        working-directory: frontend
        run: npm run test:e2e

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend frontend
